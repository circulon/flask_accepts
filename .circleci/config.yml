version: 2.1
orbs:
  codecov: codecov/codecov@5.3.0
jobs:
  build:
    docker:
      - image: cimg/python:3.10
        environment:
          FLASK_CONFIG: test
    steps:
      - checkout
      - run: pip install -r requirements.txt -r dev-requirements.txt
      - run: pytest pytest-cov
      - run: pytest --cov=flask_accepts --cov-report xml --cov-report html
      - store_artifacts:
          path: htmlcov
      - codecov/upload
